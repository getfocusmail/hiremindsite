  <main id="main-content" class="section-cta section--default">
    <section class="container cta-inner" aria-labelledby="support-heading">
      <header class="section-head">
        <h1 id="support-heading" class="page-title">Support</h1>
        <p class="sub">Need help with HireMind? Send us a message and we will get back to you by email.</p>
      </header>
      <div class="cta-card">
        <form data-support-form>
          <div class="form-grid">
            <div class="form-field">
              <label for="supportName">Name</label>
              <input id="supportName" name="name" autocomplete="name" />
            </div>
            <div class="form-field">
              <label for="supportEmail">Your email</label>
              <input id="supportEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="form-field form-field--full">
              <label for="supportSubject">Subject</label>
              <input id="supportSubject" name="subject" required placeholder="How can we help?" />
            </div>
            <div class="form-field form-field--full">
              <label for="supportMessage">Message</label>
              <textarea id="supportMessage" name="message" required placeholder="Tell us what you need help with."></textarea>
            </div>
          </div>
          <div class="cta-row">
            <button class="btn btn-primary" type="submit">Send Support Email</button>
          </div>
          <div class="status" data-support-status role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
