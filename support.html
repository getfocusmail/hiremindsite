<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HireMind Support</title>
  <meta name="description" content="Contact HireMind support by email." />
  <link rel="icon" type="image/png" href="public/favicon.png?v=3" />
  <link rel="shortcut icon" type="image/png" href="public/favicon.png?v=3" />
  <link rel="apple-touch-icon" href="public/apple-touch-icon.png?v=3" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html"><img src="public/logo.png" alt="HireMind logo" class="logo-mark" /> <span>Hire<span class="logo-accent">Mind</span></span></a>
      <nav class="nav-links">
        <a href="index.html#how">How It Works</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#download">Download</a>
        <a href="support.html">Support</a>
      </nav>
    </div>
  </header>

  <main class="section-cta section--default" aria-labelledby="support-heading">
    <div class="container cta-inner">
      <div class="section-head">
        <h1 id="support-heading" class="page-title">Support</h1>
        <p class="sub">Need help with HireMind? Send us a message and we will get back to you by email.</p>
      </div>
      <div class="cta-card">
        <form data-support-form>
          <div class="form-grid">
            <div class="form-field">
              <label for="supportName">Name</label>
              <input id="supportName" name="name" autocomplete="name" />
            </div>
            <div class="form-field">
              <label for="supportEmail">Your email</label>
              <input id="supportEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="form-field form-field--full">
              <label for="supportSubject">Subject</label>
              <input id="supportSubject" name="subject" required placeholder="How can we help?" />
            </div>
            <div class="form-field form-field--full">
              <label for="supportMessage">Message</label>
              <textarea id="supportMessage" name="message" required placeholder="Tell us what you need help with."></textarea>
            </div>
          </div>
          <div class="cta-row">
            <button class="btn btn-primary" type="submit">Send Support Email</button>
          </div>
          <div class="status" data-support-status></div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>HireMind</div>
      <div class="footer-links">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="mailto:getfocusmail@gmail.com">Contact</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
